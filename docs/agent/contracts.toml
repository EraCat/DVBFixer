[contracts.diffusion-runner-publication-provenance]
status = "partial"
owner = "src/dvbfixer/model/diffusion/pipeline.py::run_diffusion_pipeline"
description = "Public opt-in experimental diffusion request/runner/validation boundary with fail-closed scope admission, candidate-matched DatRecord generation, bounded digest-linked sampler traces, separate provenance, and one-rename result-bundle publication."
producers = [
  "src/dvbfixer/model/diffusion_cli.py::run_diffusion_model",
  "src/dvbfixer/model/diffusion/runner.py::run_diffusion_runner",
  "src/dvbfixer/model/diffusion/validate.py::build_validated_result",
  "src/dvbfixer/model/diffusion/pipeline.py::publish_diffusion_bundle",
]
consumers = [
  "src/dvbfixer/model/pipeline.py::main",
  "explicit Protenix CUDA and Protpardelle CUDA and MPS protocol runners",
  "downstream minimize through the published candidate DatRecord",
]
identity_keys = [
  "atom=(case-sensitive chain,residue_number,insertion_code,atom_name)",
  "residue=(case-sensitive chain,residue_number,insertion_code)",
  "candidate=(candidate_id,seed,coordinate SHA-256)",
  "sampler trace=(candidate_id,trace SHA-256)",
  "bundle=destination directory committed by one same-parent rename",
]
source_mutation = "The normalized source is read-only. Runner and validation artifacts remain in a removable isolated workspace; publication writes a new destination directory and rejects an existing one."
commit_behavior = "Each selected candidate and sampler trace is re-read as a private regular digest-matched file; PDB, DatRecord JSON, bounded trace, sanitized provenance, and bundle index are fsynced in a hidden same-parent directory, then exposed by one directory rename."
failure_behavior = "Unsupported scope does not launch a runner. Runner, parsing, validation, digest, file-type, staging, or rename failure publishes no destination bundle and cleans hidden staging; there is no automatic backend or device fallback."
test_files = [
  "tests/test_diffusion_cli.py",
  "tests/test_diffusion_pipeline.py",
  "tests/test_diffusion_provenance.py",
  "tests/test_diffusion_runner.py",
  "tests/test_diffusion_runner_refinement.py",
  "tests/test_diffusion_scope.py",
  "tests/test_diffusion_validate.py",
  "tests/test_cc89_cuda_profile.py",
]
known_divergences = [
  "Model, sequential batch/resume, ZBS, Homology, and GUI expose scoped experimental diffusion; wider scientific strata require separate acceptance.",
  "Atomic directory rename assumes one local filesystem; durability still depends on host filesystem semantics.",
  "CUDA cc89 admits one CYS-free internal 5-10 gap with its frozen local/physical-position policy and isolated CUDA refinement. Long gaps, adaptive/full-context cc89 and joint gap-bearing chains remain research-only. Geometry acceptance alone does not establish withheld-coordinate accuracy; MPS expansion is separate.",
]
